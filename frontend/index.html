<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignSpeak AI · Dhritika Sahu</title>
    <meta name="author" content="Dhritika Sahu" />
    <meta
      name="description"
      content="SignSpeak AI, built by Dhritika Sahu at Medi-Caps University, turns hand signs into English sentences and speech."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@380;500;640&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var stored = localStorage.getItem("signspeak-theme")
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        if (dark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
